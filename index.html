<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=TracNghiemGDQP.html">
    <title>Đang mở đề kiểm tra GDQP 12...</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .box {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 20px;
            padding: 28px 32px;
            backdrop-filter: blur(12px);
            max-width: 420px;
        }
        h1 { margin: 0 0 8px; font-size: 20px; }
        p { margin: 0; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.88); }
        a { color: #fff; font-weight: 700; }
        .mark {
            position: relative;
            width: 96px; height: 96px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
        }
        .mark svg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            animation: spin 1.15s linear infinite;
        }
        .mark circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }
        .mark .track { stroke: rgba(255, 255, 255, 0.28); }
        .mark .arc { stroke: #fff; stroke-dasharray: 327; stroke-dashoffset: 82; }
        .mark span {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.03em;
        }
        @keyframes spin { to { transform: rotate(270deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 120 120">
                <circle class="track" cx="60" cy="60" r="52"></circle>
                <circle class="arc" cx="60" cy="60" r="52"></circle>
            </svg>
            <span>B1n</span>
        </div>
        <h1>Đang mở đề kiểm tra...</h1>
        <p>Nếu trình duyệt không tự chuyển, <a href="TracNghiemGDQP.html">bấm vào đây</a>.</p>
    </div>
</body>
</html>
